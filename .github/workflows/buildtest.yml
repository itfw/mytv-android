name: Buildtest

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择运行的分支 (main/beta/dev)'
        required: true
        default: 'dev'
        type: choice
        options:
          - main
          - beta
          - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}
        fetch-depth: 0
        submodules: 'true'

    - name: Init Empty Changelog
      run: |
        {
          echo "changelog<<EOF"
          echo "## Changelog"
          echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Get changelog
      id: changelog
      run: |
        {
          echo "changelog<<EOF"
          git log --pretty=format:"- %s (%h)" -10
          echo ""
          echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Add signing properties
      env:
        SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
      run: |
        echo "$SIGNING_PROPERTIES" | base64 -d > signing.properties
        echo "signing.properties generated:"
        cat signing.properties

    - name: Add jks file
      env:
        SIGN_KEY: ${{ secrets.SIGN_KEY }}
      run: |
        echo "$SIGN_KEY" | base64 -d > keystore.jks
        ls -l keystore.jks
        
    - name: Verify keystore hash
      run: sha256sum keystore.jks

    - name: Verify keystore
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        keytool -list -keystore keystore.jks -storepass "$STORE_PASSWORD" | head -5

    - name: Add SHORT_SHA Environment Variable
      id: short-sha
      shell: bash
      run: echo "short_sha=`git rev-parse --short HEAD`" >> $GITHUB_ENV

    - name: Build with Gradle (Release)
      if: inputs.branch == 'main'
      env:
        VERSION_CODE: ${{ github.run_number }}
      run: ./gradlew :tv:assembleRelease

    - name: Build with Gradle (Dev)
      if: inputs.branch == 'beta' || inputs.branch == 'dev'
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        VERSION_CODE: ${{ github.run_number }}
      run: ./gradlew :tv:assembleDebug --warning-mode=all

    - name: Move Metadata (Dev)
      if: inputs.branch == 'beta' || inputs.branch == 'dev'
      run: |
        mv tv/build/outputs/apk/original/debug/output-metadata.json tv/build/outputs/apk/release/output-metadata.json

    - name: Move Metadata (Release)
      if: inputs.branch == 'main'
      run: |
        mv tv/build/outputs/apk/original/release/output-metadata.json tv/build/outputs/apk/release/output-metadata.json

    - name: Read apk output metadata
      id: apk-meta-release
      uses: juliangruber/read-file-action@v1
      with:
        path: tv/build/outputs/apk/release/output-metadata.json

    - name: Parse apk infos
      run: |
        echo "info_version_code=${{ fromJson(steps.apk-meta-release.outputs.content).elements[0].versionCode }}" >> $GITHUB_ENV
        echo "info_version_name=${{ fromJson(steps.apk-meta-release.outputs.content).elements[0].versionName }}" >> $GITHUB_ENV

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ inputs.branch }}-${{ env.short_sha }}
        path: |
          tv/build/outputs/apk/release/*.apk
          tv/build/outputs/apk/original/**/*.apk
        if-no-files-found: warn
