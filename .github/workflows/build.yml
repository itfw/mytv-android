name: Kotlin CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择运行的分支 (main/beta/dev)'
        required: true
        default: 'dev'
        type: choice
        options:
          - main
          - beta
          - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}
        fetch-depth: 0
        submodules: 'true'

    - name: Init Empty Changelog
      run: |
        {
          echo "changelog<<EOF"
          echo "## Changelog"
          echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Get changelog
      id: changelog
      run: |
        {
          echo "changelog<<EOF"
          git log --pretty=format:"- %s (%h)" -10
          echo ""
          echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Add signing properties
      run: |
        echo ${{ secrets.SIGNING_PROPERTIES }} > encoded_signing_properties
        base64 -d -i encoded_signing_properties > signing.properties

    - name: Add jks file
      run: |
        echo ${{ secrets.SIGN_KEY }} > ./encoded_key
        base64 -d -i encoded_key > keystore.jks

    - name: Add SHORT_SHA Environment Variable
      id: short-sha
      shell: bash
      run: echo "short_sha=`git rev-parse --short HEAD`" >> $GITHUB_ENV

    - name: Build with Gradle (Release)
      if: inputs.branch == 'main'
      env:
        VERSION_CODE: ${{ github.run_number }}
      run: ./gradlew :tv:assembleRelease

    - name: Build with Gradle (Dev)
      if: inputs.branch == 'beta' || inputs.branch == 'dev'
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        VERSION_CODE: ${{ github.run_number }}
      run: ./gradlew :tv:assembleDebug --warning-mode=all

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ inputs.branch }}-${{ env.short_sha }}
        path: |
          tv/build/outputs/apk/**/*.apk
        if-no-files-found: warn
